<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b2b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="5kg訓練"><link rel="manifest" href="manifest.webmanifest"><title>5kg 增肌訓練器</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#17302c;background:#f3f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:16px 14px 90px}.hero{background:#102b2b;color:white;padding:24px;border-radius:22px;margin-bottom:12px}.hero h1{margin:0 0 8px;font-size:25px}.muted{color:#667b75;font-size:13px}.hero .muted{color:#d2e4dc}.tabs{display:flex;gap:7px;margin:12px 0;overflow:auto}.tabs button{flex:1;white-space:nowrap}.card{background:white;border:1px solid #dce7df;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #153a2810}button{border:1px solid #bed0c5;background:#fff;color:#17382c;border-radius:12px;padding:11px 13px;font-size:14px;font-weight:650;cursor:pointer}button.active,button.primary{background:#176d54;color:white;border-color:#176d54}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.pill{border-radius:40px;background:#eaf5ee;padding:6px 11px;font-size:12px}.clock{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}.timer{background:#e5f3ea;padding:15px;border-radius:17px;margin:12px 0}h2{font-size:19px;margin:0 0 9px}h3{font-size:17px;margin:0 0 6px}.progress{height:9px;background:#e3eae5;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#23845f}.small{font-size:13px;color:#4d6a60}.step{font-size:14px;line-height:1.6}.stage{background:#f1f7f3;text-align:center;border-radius:13px;padding:8px;margin:10px 0}.stage svg{max-width:330px;width:100%;height:190px}.person{stroke:#174f42;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}.joint{fill:#174f42}.weight{stroke:#dd8d3a;stroke-width:10;stroke-linecap:round}.floor,.bench{stroke:#a5bcb0;stroke-width:6;fill:none}.moving{transform-origin:180px 115px}.animate .moving{animation:rep 2.6s ease-in-out 1 both}@keyframes rep{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-17px) rotate(-7deg)}}.caption{font-size:11px;color:#6b8179}.sets{display:grid;gap:8px}.set{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;background:#f6faf7;padding:10px;border-radius:12px}.set.done{background:#e4f4e8}.set label{font-size:12px}.set input{width:100%;padding:10px;border:1px solid #cbd8d0;border-radius:8px;font-size:16px}.set button{grid-column:1/3}.footer{color:#73877f;font-size:12px;line-height:1.6;margin-top:20px}hr{border:0;border-top:1px solid #e4ebe6;margin:8px 0}</style></head><body><main id="app"></main><script>
'use strict';
const days=[{name:'推｜胸・肩・三頭',items:[['啞鈴臥推','5 kg／手',3,'10–15',120,'bench','手腕中立、肩胛穩定；沒有穩固椅子可改地板臥推。'],['啞鈴肩推','5 kg／手',2,'8–12',120,'press','收緊核心，不要過度拱腰。'],['伏地挺身','徒手',2,'8–15',120,'pushup','身體呈一直線，手掌穩定。'],['啞鈴三頭伸展','單支 5 kg',2,'10–15',90,'triceps','雙手握穩啞鈴，手肘盡量固定。']]},{name:'拉｜背・二頭・後肩',items:[['單手啞鈴划船','5 kg／手',3,'10–15／側',120,'row1','單側完成後換邊，兩側完成算一組。'],['雙手俯身啞鈴划船','5 kg／手',2,'10–15',120,'row2','髖部後推，背部中立，手肘稍向外。'],['啞鈴二頭彎舉','5 kg／手',2,'10–15',90,'curl','手肘靠近身體，不甩動。'],['啞鈴錘式彎舉','5 kg／手',2,'10–15',90,'hammer','掌心相對，緩慢下降。'],['俯臥 Y-T 抬手','徒手',2,'8–12',60,'yt','先做 Y 再做 T，保持肩頸放鬆。']]},{name:'腿｜腿・臀・核心',items:[['高腳杯深蹲','單支 5 kg',3,'10–15',120,'squat','腳掌踩穩，膝蓋朝腳尖方向。'],['啞鈴羅馬尼亞硬舉','5 kg／手',2,'10–15',120,'rdl','髖部向後推，啞鈴靠近腿部。'],['反向弓箭步','徒手或 5 kg／手',2,'8–12／側',120,'lunge','後跨時保持平衡，兩側完成算一組。'],['站姿提踵','徒手或單支 5 kg',2,'12–20',60,'calf','緩慢踮腳與下降，必要時扶穩固支撐物。'],['死蟲式','徒手',2,'8–12／側',60,'deadbug','保持腰背穩定，手腳交替伸展。']]}];
const KEY='fit5kg-v4';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{db={}}db.sessions??=[];db.drafts??={};let day=0,tab='train',timerEnd=0,timerLeft=0,timerRunning=false,tickId=null;const root=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('無法儲存，請改用 Safari 開啟或匯出備份。')}}const k=(d,i,j)=>d+'-'+i+'-'+j;function draft(){db.drafts[day]??={};return db.drafts[day]};function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};function remaining(){return timerRunning?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):timerLeft};function timerStart(sec){timerLeft=sec;timerEnd=Date.now()+sec*1000;timerRunning=true;ensureTick();renderTimer()};function ensureTick(){if(tickId)return;tickId=setInterval(()=>{if(timerRunning&&remaining()<=0){timerRunning=false;timerLeft=0;try{navigator.vibrate?.(200)}catch{}document.title='休息結束｜5kg訓練器'}renderTimer()},250)}function timerToggle(){if(timerRunning){timerLeft=remaining();timerRunning=false}else if(timerLeft>0){timerEnd=Date.now()+timerLeft*1000;timerRunning=true}renderTimer()}function timerReset(){timerRunning=false;timerLeft=0;renderTimer()}function renderTimer(){const el=document.getElementById('timer');if(el)el.innerHTML='<div class="row between"><div><div class="small">組間休息倒數</div><div class="clock">'+format(remaining())+'</div></div><div class="row"><button onclick="timerToggle()">'+(timerRunning?'暫停':'繼續')+'</button><button onclick="timerReset()">清除</button></div></div>'}
const poses={bench:['M105 141 L215 141 M105 141 L83 192 M215 141 L247 192','M151 140 L151 88 M195 140 L195 88'],press:['M180 80 V155 M180 155 L148 203 M180 155 L212 203','M180 96 L143 88 L143 45 M180 96 L217 88 L217 45'],pushup:['M100 120 L254 153 L285 196 M254 153 L264 196','M130 133 L130 185 M218 146 L217 185'],triceps:['M180 80 V154 M180 154 L149 201 M180 154 L211 201','M180 98 L155 72 L179 32 M180 98 L205 72 L179 32'],row1:['M150 93 L114 146 L195 151 M195 151 L242 198 M195 151 L170 201','M176 116 L210 139 L210 177'],row2:['M165 90 L208 139 L180 198 M208 139 L243 198','M180 105 L135 140 L145 163 M199 123 L242 143 L231 163'],curl:['M180 77 V156 M180 156 L149 202 M180 156 L211 202','M180 95 L144 123 L158 95 M180 95 L216 123 L202 95'],hammer:['M180 77 V156 M180 156 L149 202 M180 156 L211 202','M180 95 L145 123 L145 93 M180 95 L215 123 L215 93'],yt:['M180 138 V193 M180 193 L147 201 M180 193 L213 201','M180 153 L123 92 M180 153 L237 92'],squat:['M180 77 V138 M180 138 L145 165 L143 203 M180 138 L215 165 L217 203','M180 99 L159 116 M180 99 L201 116'],rdl:['M170 78 L211 139 L176 201 M211 139 L245 201','M185 96 L150 157 M202 124 L225 157'],lunge:['M180 76 V139 M180 139 L125 162 L118 203 M180 139 L237 166 L266 203','M180 94 L149 152 M180 94 L211 152'],calf:['M180 76 V147 M180 147 L158 195 M180 147 L202 195','M158 195 L170 186 M202 195 L214 186'],deadbug:['M124 160 L215 160','M145 158 L155 90 M181 158 L212 106 M215 160 L240 112 M215 160 L274 181']};
function diagram(type,i){const p=poses[type];return '<div class="stage"><svg viewBox="0 0 360 225" role="img" aria-label="非真人動作示意"><path class="floor" d="M24 209 H336"/><circle class="joint" cx="'+(type==='row1'||type==='row2'||type==='rdl'?165:type==='pushup'?95:type==='deadbug'?110:180)+'" cy="'+(type==='pushup'?118:type==='deadbug'?156:64)+'" r="12"/><path class="person" d="'+p[0]+'"/><g class="moving"><path class="person" d="'+p[1]+'"/></g></svg><div class="caption">此為動作辨識示意，不是精確的姿勢教學</div><button onclick="replay('+i+')">▶ 播放一次</button></div>'}function replay(i){const e=document.querySelector('[data-diagram="'+i+'"]');if(!e)return;e.classList.remove('animate');void e.offsetWidth;e.classList.add('animate')}
function completedCount(){let n=0;days[day].items.forEach((e,i)=>{for(let j=0;j<e[2];j++)if(draft()[k(day,i,j)]?.done)n++});return n}function exercise(e,i){const sets=Array.from({length:e[2]},(_,j)=>{const id=k(day,i,j),v=draft()[id]||{},done=!!v.done;return '<div class="set '+(done?'done':'')+'"><label>第 '+(j+1)+' 組 · 次數<input type="number" min="0" max="100" inputmode="numeric" value="'+esc(v.reps??'')+'" placeholder="'+esc(e[3])+'" onchange="setField(\''+id+'\',\'reps\',this.value)"></label><label>重量 kg<input type="number" min="0" max="300" step="0.5" inputmode="decimal" value="'+esc(v.weight??(e[1].includes('5 kg')?'5':'0'))+'" onchange="setField(\''+id+'\',\'weight\',this.value)"></label><button class="'+(done?'':'primary')+'" onclick="mark(\''+id+'\','+e[4]+')">'+(done?'✓ 已完成（取消）':'完成這組')+'</button></div>'}).join('');return '<section class="card"><div class="row between"><h3>'+(i+1)+'. '+e[0]+'</h3><span class="pill">'+e[2]+' 組</span></div><div class="small">'+e[1]+' · '+e[3]+' 次 · 休息 '+e[4]+' 秒</div><p class="step">'+e[6]+'</p><div data-diagram="'+i+'">'+diagram(e[5],i)+'</div><div class="sets">'+sets+'</div></section>'}
function render(){const count=completedCount(),total=days[day].items.reduce((a,b)=>a+b[2],0);root.innerHTML='<div class="hero"><h1>🏋️ 5kg 增肌訓練器</h1><div class="muted">繁體中文 · 三練一休 · 離線支援 · 本機紀錄</div></div><div class="tabs"><button class="'+(tab==='train'?'active':'')+'" onclick="changeTab(\'train\')">開始訓練</button><button class="'+(tab==='history'?'active':'')+'" onclick="changeTab(\'history\')">歷史紀錄</button><button class="'+(tab==='settings'?'active':'')+'" onclick="changeTab(\'settings\')">備份／說明</button></div>'+(tab==='train'?'<div class="tabs">'+days.map((d,i)=>'<button class="'+(day===i?'active':'')+'" onclick="changeDay('+i+')">Day '+(i+1)+'</button>').join('')+'</div><div class="card"><div class="row between"><h2>'+days[day].name+'</h2><span class="pill">'+count+'/'+total+' 組</span></div><div class="progress"><div style="width:'+(count/total*100)+'%"></div></div><p class="muted">先熱身 5–10 分鐘；大部分訓練保留約 2–3 次餘力。</p></div><div class="timer" id="timer"></div>'+days[day].items.map(exercise).join('')+'<div class="card"><button class="primary" onclick="finishSession()" style="width:100%">✓ 儲存今天的訓練</button><p class="muted">儲存後加入歷史紀錄並清空今天的草稿。</p></div>':tab==='history'?historyHtml():settingsHtml())+'<div class="footer">非真人動畫僅供辨識，不可取代教練指導。Day 4 休息；如有疼痛、動作不穩或恢復不足，請停止並調整。</div>';renderTimer()}function changeTab(t){tab=t;render()}function changeDay(i){day=i;render()}function setField(id,f,v){draft()[id]??={};draft()[id][f]=v;save()}function mark(id,sec){draft()[id]??={};const v=draft()[id];v.done=!v.done;if(v.done){v.reps??='';v.weight??='5';timerStart(sec)}save();render()}function finishSession(){const entries=[];days[day].items.forEach((e,i)=>{const sets=[];for(let j=0;j<e[2];j++){const v=draft()[k(day,i,j)];if(v?.done)sets.push({set:j+1,reps:v.reps===''?null:Number(v.reps),weight:Number(v.weight)||0})}if(sets.length)entries.push({exercise:e[0],sets})});if(!entries.length){alert('請先完成至少一組');return}db.sessions.unshift({id:Date.now(),date:new Date().toISOString(),day,entries});db.drafts[day]={};save();tab='history';timerReset();render()}function historyHtml(){return '<div class="card"><h2>歷史訓練</h2><p class="muted">紀錄只保存在這台裝置的瀏覽器。</p>'+(db.sessions.length?db.sessions.map(s=>'<div class="card"><strong>'+new Date(s.date).toLocaleString('zh-TW')+' · Day '+(s.day+1)+'</strong><div class="small">'+s.entries.map(e=>esc(e.exercise)+'：'+e.sets.map(x=>'第'+x.set+'組 '+(x.reps??'未填')+'次 / '+x.weight+'kg').join('、')).join('<hr>')+'</div></div>').join(''):'尚無紀錄')+'</div>'}function settingsHtml(){return '<div class="card"><h2>備份與還原</h2><p class="muted">更換裝置或清除網站資料前，請匯出備份。</p><div class="row"><button class="primary" onclick="exportData()">匯出 JSON</button><label class="pill">匯入 JSON<input type="file" accept=".json,application/json" onchange="importData(this)" style="display:none"></label></div></div><div class="card"><h2>使用方式</h2><p>選擇 Day → 播放示意 → 完成動作 → 填入次數 → 點「完成這組」→ 倒數休息 → 儲存訓練。</p><p class="muted">iPhone 鎖定時可能暫停網頁更新，重新開啟後依實際時間校正；不能保證背景聲音或通知。</p></div>'}function exportData(){const blob=new Blob([JSON.stringify({version:1,data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='5kg-workout-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(input){const f=input.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.data||!Array.isArray(obj.data.sessions)||typeof obj.data.drafts!=='object')throw Error('格式不符');if(!confirm('將覆蓋目前訓練資料，確定嗎？'))return;db=obj.data;save();render();alert('還原完成')}catch(e){alert('匯入失敗：'+e.message)}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
